
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Professional Hauliers Limited</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

            .logo-container img {
                display: block;
                max-width: 180px;
                max-height: 100px;
                width: auto;
                height: auto;
                object-fit: contain;
                margin: 0 auto 15px;
            }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 23px;
            color: #12345a;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            color: #0f172a;
            font-size: 15px;
            outline: none;
        }

            input:focus {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }

        .password-wrapper {
            display: flex;
            gap: 8px;
        }

            .password-wrapper input {
                flex: 1;
                min-width: 0;
            }

        .toggle-password {
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #f8fafc;
            color: #334155;
            cursor: pointer;
            font-size: 13px;
        }

            .toggle-password:hover {
                background: #e2e8f0;
            }

        .error-message {
            display: none;
            margin: 0 0 16px;
            padding: 11px 12px;
            border: 1px solid #fecaca;
            border-radius: 7px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

            .error-message.show {
                display: block;
            }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #12345a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

            .login-button:hover {
                background: #1d4e89;
            }

            .login-button:disabled {
                opacity: 0.65;
                cursor: not-allowed;
            }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <div class="logo-container">
            <img src="/phl-logo.png"
                 alt="Professional Hauliers Limited"
                 onerror="this.style.display='none';">

            <h1>Professional Hauliers Limited</h1>
            <p class="subtitle">Fleet Management System</p>
        </div>

        <form id="lform" autocomplete="on" novalidate>

            <div class="form-group">
                <label for="u">Username</label>

                <input id="u"
                       name="username"
                       type="text"
                       autocomplete="username"
                       autocapitalize="none"
                       spellcheck="false"
                       autofocus
                       required
                       maxlength="100">
            </div>

            <div class="form-group">
                <label for="p">Password</label>

                <div class="password-wrapper">
                    <input id="p"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password">
                        Show
                    </button>
                </div>
            </div>

            <div id="err"
                 class="error-message"
                 role="alert"
                 aria-live="polite"></div>

            <button type="submit"
                    id="go"
                    class="login-button">
                Log In
            </button>

        </form>

        <div class="footer">
            &copy; Professional Hauliers Limited
        </div>

    </main>

    <script>
        (function () {
            var GO_TO = "/fleet";

            function $(id) {
                return document.getElementById(id);
            }

            function showErr(message) {
                var error = $("err");
                error.textContent = message;
                error.classList.add("show");
            }

            function clearErr() {
                $("err").textContent = "";
                $("err").classList.remove("show");
            }

            // Show or hide the password.
            $("togglePassword").addEventListener("click", function () {
                var password = $("p");
                var show = password.type === "password";

                password.type = show ? "text" : "password";
                this.textContent = show ? "Hide" : "Show";
                this.setAttribute(
                    "aria-label",
                    show ? "Hide password" : "Show password"
                );
            });

            // Clear the error when the user edits either field.
            ["u", "p"].forEach(function (id) {
                $(id).addEventListener("input", clearErr);
            });

            // Submit login details to the server.
            $("lform").addEventListener("submit", function (event) {
                event.preventDefault();
                clearErr();

                var username = $("u").value.trim();
                var password = $("p").value;

                if (!username || !password) {
                    showErr("Enter your username and password.");
                    return;
                }

                var button = $("go");
                button.disabled = true;
                button.textContent = "Logging in...";

                fetch("/api/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })
                    .then(function (response) {
                        return response.json()
                            .catch(function () {
                                return {};
                            })
                            .then(function (data) {
                                return {
                                    ok: response.ok,
                                    data: data
                                };
                            });
                    })
                    .then(function (result) {
                        if (result.ok) {
                            window.location.replace(GO_TO);
                            return;
                        }

                        $("p").value = "";
                        $("p").focus();

                        showErr(
                            result.data.error ||
                            "Username or password is incorrect."
                        );

                        button.disabled = false;
                        button.textContent = "Log In";
                    })
                    .catch(function () {
                        showErr(
                            "Cannot reach the server. Check your connection and try again."
                        );

                        button.disabled = false;
                        button.textContent = "Log In";
                    });
            });
        })();
    </script>
</body>
</html>
