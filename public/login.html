<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Professional Hauliers</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0b4a8f;
            --navy-deep: #073766;
            --orange: #f07a24;
            --ink: #14130f;
            --mute: #5f6b7a;
            --line: #d9dee5;
            --bg: #ffffff;
            --err-bg: #fee2e2;
            --err-fg: #b91c1c;
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font: 15px/1.5 "Inter","Segoe UI",system-ui,sans-serif;
            color: var(--ink);
            background: var(--bg)
        }

        .wrap {
            display: grid;
            grid-template-columns: minmax(320px,46%) 1fr;
            min-height: 100vh
        }

        /* Brand side */
        .brand {
            background: var(--navy);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            position: relative;
            overflow: hidden;
        }

            .brand::after { /* orange edge, echoes the swoosh in the logo */
                content: "";
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 8px;
                background: var(--orange);
            }

        .logobox {
            background: #fff;
            border-radius: 18px;
            padding: 22px 28px;
            width: min(340px,100%);
        }

            .logobox img {
                display: block;
                width: 100%;
                height: auto
            }

        .brand h2 {
            margin: 0 0 10px;
            font-size: 30px;
            line-height: 1.15;
            letter-spacing: -.02em;
            font-weight: 700;
            max-width: 340px
        }

        .brand p {
            margin: 0;
            color: #c4d6ec;
            max-width: 340px
        }

        /* Form side */
        .panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px
        }

        form {
            width: min(400px,100%)
        }

            form h1 {
                margin: 0 0 6px;
                font-size: 30px;
                letter-spacing: -.025em;
                line-height: 1.15;
                font-weight: 800
            }

            form .sub {
                margin: 0 0 28px;
                color: var(--mute)
            }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px
        }

        .field {
            margin-bottom: 18px;
            position: relative
        }

        input {
            font: inherit;
            font-size: 15.5px;
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            transition: border-color .15s, box-shadow .15s;
        }

            input:focus {
                outline: none;
                border-color: var(--navy);
                box-shadow: 0 0 0 4px rgba(11,74,143,.15)
            }

        .pw input {
            padding-right: 78px
        }

        .toggle {
            position: absolute;
            right: 8px;
            bottom: 7px;
            border: 0;
            background: none;
            color: var(--navy);
            font: 600 13.5px inherit;
            font-family: inherit;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer
        }

            .toggle:hover {
                background: #eef3f9
            }

            .toggle:focus-visible, .go:focus-visible {
                outline: 3px solid var(--orange);
                outline-offset: 2px
            }

        .go {
            width: 100%;
            margin-top: 6px;
            border: 0;
            cursor: pointer;
            background: var(--orange);
            color: #1c0e00;
            font: 700 16px inherit;
            font-family: inherit;
            padding: 14px 18px;
            border-radius: 12px;
            transition: filter .15s, transform .05s;
        }

            .go:hover {
                filter: brightness(.96)
            }

            .go:active {
                transform: translateY(1px)
            }

            .go:disabled {
                opacity: .55;
                cursor: not-allowed
            }

        .err {
            display: none;
            background: var(--err-bg);
            color: var(--err-fg);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            margin-bottom: 18px
        }

            .err.show {
                display: block
            }

        .note {
            margin-top: 22px;
            font-size: 13px;
            color: var(--mute)
        }

        @media (max-width:820px) {
            .wrap {
                grid-template-columns: 1fr
            }

            .brand {
                padding: 28px 24px 32px;
                gap: 22px
            }

                .brand::after {
                    top: auto;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    width: auto;
                    height: 6px
                }

            .logobox {
                width: 200px;
                padding: 14px 18px;
                border-radius: 14px
            }

            .brand h2 {
                font-size: 22px
            }

            .panel {
                align-items: flex-start;
                padding-top: 32px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <aside class="brand">
            <div class="logobox">
                <img src="phl-logo.png" alt="Professional Hauliers Limited">
            </div>
            <div>
                <h2>Fuel and fleet records for the Zambia to DRC corridor.</h2>
                <p>Authorised staff only.</p>
            </div>
        </aside>

        <main class="panel">
            <form id="lform" autocomplete="off" novalidate>
                <h1>Log in</h1>
                <p class="sub">Enter your username and password to open the system.</p>

                <div class="err" id="err" role="alert"></div>

                <div class="field">
                    <label for="u">Username</label>
                    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
                </div>

                <div class="field pw">
                    <label for="p">Password</label>
                    <input id="p" name="password" type="password" autocomplete="current-password">
                    <button type="button" class="toggle" id="tg" aria-controls="p">Show</button>
                </div>

                <button type="submit" class="go" id="go">Log in</button>
                <div class="note">Forgot your password? Ask the operations manager.</div>
            </form>
        </main>
    </div>

    <script>
        (function () {
            var GO_TO = "/";   // page to open after a successful login

            function $(i) { return document.getElementById(i); }
            function showErr(msg) { var e = $("err"); e.textContent = msg; e.classList.add("show"); }
            function clearErr() { $("err").classList.remove("show"); }

            $("tg").addEventListener("click", function () {
                var p = $("p"), show = p.type === "password";
                p.type = show ? "text" : "password";
                this.textContent = show ? "Hide" : "Show";
            });

            ["u", "p"].forEach(function (id) { $(id).addEventListener("input", clearErr); });

            $("lform").addEventListener("submit", function (e) {
                e.preventDefault();
                var u = $("u").value.trim(), p = $("p").value;
                if (!u || !p) { showErr("Enter your username and password."); return; }

                $("go").disabled = true;
                fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                })
                    .then(function (r) {
                        return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
                    })
                    .then(function (res) {
                        if (res.ok) { location.replace(GO_TO); return; }
                        $("p").value = ""; $("p").focus();
                        showErr(res.j.error || "Username or password is incorrect.");
                        $("go").disabled = false;
                    })
                    .catch(function () {
                        showErr("Cannot reach the server. Check your connection and try again.");
                        $("go").disabled = false;
                    });
            });
        })();
    </script>
</body>
</html>
